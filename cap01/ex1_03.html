<script>
    const a = "20"
    const b = a * 2
    const c = a / 2
    const d = a - 2
    let e = a + 2

    alert("a: " + a)
    alert("b: " + b)
    alert("c: " + c)
    alert("d: " + d)
    alert("e: " + e)

    /*
    Converter texto para número:
    Number(), parseInt() e parseFloat()
    */
    e = Number(a) + 2
    alert("e: " + e)
</script>
