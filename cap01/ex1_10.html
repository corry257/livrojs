<meta charset="UTF8">
<script>
    /*
    Programa par ama pizzaria que leia o valor total de uma onta e quantos clientes vão paga-la
    */
    const conta = Number(prompt("Insira o valor da conta"))
    const clientes = Number(prompt("Quantos clientes vão dividir a conta?"))
    const divisao = conta / clientes 
    alert(`Valor por cliente: R$${divisao.toFixed(2)}`)
</script>
